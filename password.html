<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protected · Quickflows.ai Case Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #FAFAF7;
    --bg-2:     #F2F1EB;
    --bg-3:     #E9E7E0;
    --text:     #1A1917;
    --muted:    #6A6860;
    --border:   #E2DFD6;
    --accent:   #6D1FC7;
    --accent-2: #EEE5FF;
    --accent-3: #D9CAFF;
    --serif: 'Fraunces', Georgia, serif;
    --sans:  'DM Sans', system-ui, sans-serif;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  /* ── Full-screen centred layout ── */
  .gate {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  /* ── Card ── */
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 40px 36px 36px;
    box-shadow: 0 4px 32px rgba(0, 0, 0, 0.07);
  }

  /* ── Logo row ── */
  .logo-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .logo-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  .logo-text {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
  }

  /* ── Headings ── */
  .card h1 {
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  .card h1 em {
    font-style: italic;
    font-weight: 300;
    color: var(--accent);
  }
  .card p.sub {
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 28px;
  }

  /* ── NDA chip ── */
  .nda-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-2);
    color: var(--accent);
    font-size: 11px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 20px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  /* ── Form ── */
  .field {
    margin-bottom: 14px;
  }
  .field label {
    display: block;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 7px;
  }
  .field input[type="password"] {
    width: 100%;
    padding: 11px 14px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: var(--sans);
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.18s, box-shadow 0.18s;
  }
  .field input[type="password"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-2);
    background: var(--bg);
  }
  .field input[type="password"].shake {
    animation: shake 0.38s ease;
    border-color: #DC2626;
    box-shadow: 0 0 0 3px #FEE2E2;
  }

  /* ── Submit button ── */
  .btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.18s, opacity 0.18s;
    letter-spacing: 0.01em;
  }
  .btn:hover { background: #5a18a8; }
  .btn:active { opacity: 0.85; }

  /* ── Error message ── */
  .error-msg {
    display: none;
    font-size: 12.5px;
    color: #DC2626;
    margin-top: 10px;
    text-align: center;
  }
  .error-msg.visible { display: block; }

  /* ── Footer note ── */
  .gate-footer {
    margin-top: 20px;
    font-size: 11.5px;
    color: var(--muted);
    text-align: center;
    line-height: 1.6;
  }

  /* ── Shake animation ── */
  @keyframes shake {
    0%   { transform: translateX(0); }
    20%  { transform: translateX(-7px); }
    40%  { transform: translateX(7px); }
    60%  { transform: translateX(-5px); }
    80%  { transform: translateX(5px); }
    100% { transform: translateX(0); }
  }

  @media (max-width: 440px) {
    .card { padding: 32px 24px 28px; }
  }
</style>
</head>
<body>

<div class="gate">
  <div class="card">

    <!-- Logo -->
    <div class="logo-row">
      <span class="logo-dot"></span>
      <span class="logo-text">Suryakanta Jena &middot; Product Design Intern</span>
    </div>

    <!-- NDA chip -->
    <div class="nda-chip">&#9679;&nbsp; NDA Protected</div>

    <!-- Heading -->
    <h1>This case study is <em>private</em></h1>
    <p class="sub">This work is protected by an NDA. Please enter the password you were given to continue.</p>

    <!-- Form — posts to the serverless API function -->
    <form id="pw-form" method="POST" action="/api/auth">
      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter password"
          autocomplete="current-password"
          autofocus
          required
        >
      </div>

      <button type="submit" class="btn">View Case Study &rarr;</button>

      <!-- Error shown when ?error=1 is in the URL -->
      <p class="error-msg" id="error-msg">Incorrect password. Please try again.</p>
    </form>

  </div>

  <p class="gate-footer">Quickflows.ai &nbsp;&middot;&nbsp; 2025</p>
</div>

<script>
  // Show error message if redirected back with ?error=1
  (function () {
    const params = new URLSearchParams(window.location.search);
    if (params.get('error') === '1') {
      const msg   = document.getElementById('error-msg');
      const input = document.getElementById('password');
      if (msg)   msg.classList.add('visible');
      if (input) input.classList.add('shake');
    }
  })();
</script>

</body>
</html>
