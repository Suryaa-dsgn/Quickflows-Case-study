<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protected · Quickflows.ai Case Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #FAFAF7;
    --bg-2:     #F2F1EB;
    --bg-3:     #E9E7E0;
    --text:     #1A1917;
    --muted:    #6A6860;
    --border:   #E2DFD6;
    --accent:   #6D1FC7;
    --accent-2: #EEE5FF;
    --accent-3: #D9CAFF;
    --serif: 'Fraunces', Georgia, serif;
    --sans:  'DM Sans', system-ui, sans-serif;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  /* ── Full-screen centred layout ── */
  .gate {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  /* ── Card ── */
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 40px 36px 36px;
    box-shadow: 0 4px 32px rgba(0, 0, 0, 0.07);
  }

  /* ── Logo row ── */
  .logo-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .logo-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  .logo-text {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
  }

  /* ── Headings ── */
  .card h1 {
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  .card h1 em {
    font-style: italic;
    font-weight: 300;
    color: var(--accent);
  }
  .card p.sub {
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 28px;
  }

  /* ── NDA chip ── */
  .nda-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-2);
    color: var(--accent);
    font-size: 11px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 20px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  /* ── Form ── */
  .field {
    margin-bottom: 14px;
  }
  .field label {
    display: block;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 7px;
  }
  .field input[type="password"] {
    width: 100%;
    padding: 11px 14px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: var(--sans);
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.18s, box-shadow 0.18s;
  }
  .field input[type="password"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-2);
    background: var(--bg);
  }
  .field input[type="password"].shake {
    animation: shake 0.38s ease;
    border-color: #DC2626;
    box-shadow: 0 0 0 3px #FEE2E2;
  }

  /* ── Submit button ── */
  .btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.18s, opacity 0.18s;
    letter-spacing: 0.01em;
  }
  .btn:hover { background: #5a18a8; }
  .btn:active { opacity: 0.85; }

  /* ── Error message ── */
  .error-msg {
    display: none;
    font-size: 12.5px;
    color: #DC2626;
    margin-top: 10px;
    text-align: center;
  }
  .error-msg.visible { display: block; }

  /* ── Footer note ── */
  .gate-footer {
    margin-top: 20px;
    font-size: 11.5px;
    color: var(--muted);
    text-align: center;
    line-height: 1.6;
  }

  /* ── Request access link ── */
  .req-link-row {
    text-align: center;
    margin-top: 16px;
  }
  .req-link {
    font-size: 12.5px;
    color: var(--muted);
    text-decoration: none;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    font-family: var(--sans);
    transition: color 0.15s;
  }
  .req-link:hover { color: var(--accent); }
  .req-link .arr { font-size: 11px; margin-left: 2px; }

  /* ── Request access form panel ── */
  .req-panel {
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 0.38s cubic-bezier(0.4,0,0.2,1),
                opacity 0.28s ease,
                margin-top 0.28s ease;
    margin-top: 0;
  }
  .req-panel.open {
    max-height: 420px;
    opacity: 1;
    margin-top: 20px;
  }
  .req-divider {
    height: 1px;
    background: var(--border);
    margin-bottom: 18px;
  }
  .req-panel .field textarea {
    width: 100%;
    padding: 10px 14px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: var(--sans);
    font-size: 13.5px;
    color: var(--text);
    outline: none;
    resize: none;
    height: 76px;
    transition: border-color 0.18s, box-shadow 0.18s;
  }
  .req-panel .field textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-2);
    background: var(--bg);
  }
  .btn-secondary {
    width: 100%;
    padding: 11px;
    background: var(--bg-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: var(--sans);
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.18s, border-color 0.18s;
  }
  .btn-secondary:hover { background: var(--bg-3); border-color: var(--accent); }
  .btn-secondary:disabled { opacity: 0.6; cursor: not-allowed; }

  /* ── Success / error inline ── */
  .req-success {
    display: none;
    background: #DCFCE7;
    border: 1px solid #86EFAC;
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 13px;
    color: #14532D;
    line-height: 1.55;
    margin-top: 20px;
    text-align: center;
  }
  .req-success.visible { display: block; }
  .req-error {
    font-size: 12px;
    color: #DC2626;
    margin-top: 8px;
    text-align: center;
    display: none;
  }
  .req-error.visible { display: block; }

  /* ── Shake animation ── */
  @keyframes shake {
    0%   { transform: translateX(0); }
    20%  { transform: translateX(-7px); }
    40%  { transform: translateX(7px); }
    60%  { transform: translateX(-5px); }
    80%  { transform: translateX(5px); }
    100% { transform: translateX(0); }
  }

  @media (max-width: 440px) {
    .card { padding: 32px 24px 28px; }
  }
</style>
</head>
<body>

<div class="gate">
  <div class="card">

    <!-- Logo -->
    <div class="logo-row">
      <span class="logo-dot"></span>
      <span class="logo-text">Suryakanta Jena &middot; Product Design Intern</span>
    </div>

    <!-- NDA chip -->
    <div class="nda-chip">&#9679;&nbsp; NDA Protected</div>

    <!-- Heading -->
    <h1>This case study is <em>private</em></h1>
    <p class="sub">This work is protected by an NDA. Please enter the password you were given to continue.</p>

    <!-- Form — posts to the serverless API function -->
    <form id="pw-form" method="POST" action="/api/auth">
      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter password"
          autocomplete="current-password"
          autofocus
          required
        >
      </div>

      <button type="submit" class="btn">View Case Study &rarr;</button>

      <!-- Error shown when ?error=1 is in the URL -->
      <p class="error-msg" id="error-msg">Incorrect password. Please try again.</p>
    </form>

    <!-- Request access link -->
    <div class="req-link-row">
      <button class="req-link" id="req-toggle" aria-expanded="false">
        Don&rsquo;t have the password? Request access <span class="arr">&rarr;</span>
      </button>
    </div>

    <!-- Inline request access form -->
    <div class="req-panel" id="req-panel" aria-hidden="true">
      <div class="req-divider"></div>
      <form id="req-form">
        <div class="field">
          <label for="req-name">Your Name</label>
          <input id="req-name" name="name" type="text" placeholder="Jane Smith" required>
        </div>
        <div class="field">
          <label for="req-email">Your Email</label>
          <input id="req-email" name="email" type="email" placeholder="jane@company.com" required>
        </div>
        <div class="field">
          <label for="req-msg">Message <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);font-size:11px">(optional)</span></label>
          <textarea id="req-msg" name="message" placeholder="Who you are and why you&rsquo;d like access&hellip;"></textarea>
        </div>
        <button type="submit" class="btn-secondary" id="req-submit">Send Access Request</button>
        <p class="req-error" id="req-error"></p>
      </form>
      <div class="req-success" id="req-success">
        &#10003;&nbsp; Request sent! Suryakanta will be in touch via email.
      </div>
    </div>

  </div>

  <p class="gate-footer">Quickflows.ai &nbsp;&middot;&nbsp; 2025</p>
</div>

<script>
(function () {
  // ── Password error on redirect back ─────────────────
  const params = new URLSearchParams(window.location.search);
  if (params.get('error') === '1') {
    const msg   = document.getElementById('error-msg');
    const input = document.getElementById('password');
    if (msg)   msg.classList.add('visible');
    if (input) input.classList.add('shake');
  }

  // ── Request access toggle ────────────────────────────
  const toggle = document.getElementById('req-toggle');
  const panel  = document.getElementById('req-panel');

  toggle.addEventListener('click', () => {
    const isOpen = panel.classList.toggle('open');
    toggle.setAttribute('aria-expanded', isOpen);
    panel.setAttribute('aria-hidden', !isOpen);
    toggle.querySelector('.arr').textContent = isOpen ? '↑' : '→';
  });

  // ── Request access form submission ───────────────────
  const form    = document.getElementById('req-form');
  const submit  = document.getElementById('req-submit');
  const errEl   = document.getElementById('req-error');
  const success = document.getElementById('req-success');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.classList.remove('visible');
    submit.disabled = true;
    submit.textContent = 'Sending…';

    try {
      const res = await fetch('/api/request-access', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name:    document.getElementById('req-name').value.trim(),
          email:   document.getElementById('req-email').value.trim(),
          message: document.getElementById('req-msg').value.trim(),
        }),
      });

      const data = await res.json();

      if (data.ok) {
        form.style.display = 'none';
        success.classList.add('visible');
      } else {
        throw new Error(data.error || 'Something went wrong.');
      }
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.add('visible');
      submit.disabled = false;
      submit.textContent = 'Send Access Request';
    }
  });
})();
</script>

</body>
</html>
